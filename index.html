<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Laboratorio XR - Celda Industrial Multiplataforma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene>

      <!-- =========================================================
           A-ASSETS
           Aquí se precargan los recursos de la escena. Cuando se
           realice la Parte D (integración de modelo CAD), el
           archivo .glb exportado desde Blender debe copiarse a
           la carpeta /models y referenciarse aquí.
           ========================================================= -->
      <a-assets>
        <!-- Parte D: descomentar cuando exista el archivo models/modelo.glb -->
        <!-- <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item> -->
      </a-assets>

      <!-- =========================================================
           PARTE A - Escena básica (primitivas de ejemplo)
           Se conserva como referencia visual del ejercicio inicial,
           desplazada a un costado para no chocar con la celda
           industrial de la Parte C.
           ========================================================= -->
      <a-entity id="parte-a-ejemplo" position="-8 0 0">
        <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
        <a-sphere position="2 1 -4" radius="1" color="#EF2D5E"></a-sphere>
        <a-cylinder position="-2 1 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      </a-entity>

      <!-- =========================================================
           PARTE C - Modelo industrial con primitivas
           Celda de manufactura compuesta por:
             - Banda transportadora (a-box)
             - Tanque de almacenamiento (a-cylinder)
             - Brazo robotizado articulado (a-cylinder + a-box, jerarquía padre-hijo)
             - Sensores/indicadores (a-sphere)
           ========================================================= -->

      <!-- Piso de la planta -->
      <a-plane rotation="-90 0 0" width="24" height="24" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>

      <!-- ---- Grupo: Banda transportadora ---- -->
      <a-entity id="banda-transportadora" position="0 0 -4">
        <!-- Estructura / cuerpo de la banda -->
        <a-box position="0 0.5 0" width="6" height="0.2" depth="1.2" color="#4CC3D9"></a-box>
        <!-- Patas de soporte -->
        <a-cylinder position="-2.5 0.25 0" radius="0.08" height="0.5" color="#555555"></a-cylinder>
        <a-cylinder position="2.5 0.25 0" radius="0.08" height="0.5" color="#555555"></a-cylinder>
        <!-- Rodillos en los extremos -->
        <a-cylinder position="-3 0.6 0" rotation="0 0 90" radius="0.2" height="1.4" color="#FFC65D"></a-cylinder>
        <a-cylinder position="3 0.6 0" rotation="0 0 90" radius="0.2" height="1.4" color="#FFC65D"></a-cylinder>
        <!-- Sensor de presencia sobre la banda -->
        <a-sphere position="0 1.1 0" radius="0.15" color="#EF2D5E"></a-sphere>
      </a-entity>

      <!-- ---- Grupo: Tanque de almacenamiento ---- -->
      <a-entity id="tanque-almacenamiento" position="6 0 -6">
        <!-- Base / plataforma -->
        <a-box position="0 0.15 0" width="2.4" height="0.3" depth="2.4" color="#555555"></a-box>
        <!-- Cuerpo del tanque -->
        <a-cylinder position="0 1.5 0" radius="1" height="2.4" color="#EF2D5E"></a-cylinder>
        <!-- Tapa superior -->
        <a-cylinder position="0 2.75 0" radius="1.05" height="0.1" color="#4CC3D9"></a-cylinder>
        <!-- Indicador de nivel -->
        <a-sphere position="1.15 1.8 0" radius="0.12" color="#FFC65D"></a-sphere>
      </a-entity>

      <!-- ---- Grupo: Brazo robotizado (jerarquía padre-hijo anidada) ---- -->
      <a-entity id="brazo-robot" position="-6 0 -6">
        <!-- Base fija -->
        <a-cylinder position="0 0.3 0" radius="0.8" height="0.6" color="#555555"></a-cylinder>

        <!-- Eslabón 1: gira sobre la base -->
        <a-entity id="eslabon-1" position="0 0.6 0" rotation="0 20 0">
          <a-cylinder position="0 0.5 0" radius="0.25" height="1" color="#4CC3D9"></a-cylinder>

          <!-- Eslabón 2: hijo del eslabón 1 -->
          <a-entity id="eslabon-2" position="0 1 0" rotation="0 0 -30">
            <a-box position="0 0.6 0" width="0.3" height="1.2" depth="0.3" color="#FFC65D"></a-box>

            <!-- Efector final: hijo del eslabón 2 -->
            <a-entity id="efector-final" position="0 1.2 0" rotation="0 0 20">
              <a-sphere radius="0.2" color="#EF2D5E"></a-sphere>
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- =========================================================
           PARTE D - Integración de modelo CAD (SolidWorks -> Blender -> GLB)
           Descomentar esta entidad una vez que el modelo .glb esté
           cargado en a-assets. Ajustar "position" y "scale" según
           el tamaño real del ensamblaje exportado.
           ========================================================= -->
      <!--
      <a-entity
        gltf-model="#modeloIndustrial"
        position="0 0 -12"
        scale="1 1 1">
      </a-entity>
      -->

      <!-- =========================================================
           CÁMARA Y CONTROLES
           wasd-controls + look-controls: navegación en escritorio.
           cursor: permite interacción por mirada en móvil/VR/Quest.
           ========================================================= -->
      <a-entity id="rig" position="0 1.6 4">
        <a-camera wasd-controls look-controls>
          <a-cursor color="#FFFFFF"></a-cursor>
        </a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
