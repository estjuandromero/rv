<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de control en cascada</title>

<style>
:root{
  --fondo:#14181d;
  --panel:#1c222a;
  --linea:#2c353f;
  --texto:#dfe6ee;
  --tenue:#7e8c9c;
  --traza1:#59b0ff;
  --traza2:#ffc247;
  --traza3:#ff6b6b;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--fondo);
  color:var(--texto);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:15px;
  line-height:1.45;
}

header{
  padding:18px 20px 14px;
  border-bottom:1px solid var(--linea);
}

h1{
  margin:0;
  font-size:19px;
  font-weight:600;
}

header p{
  margin:3px 0 0;
  color:var(--tenue);
  font-size:13px;
}

main{
  padding:16px 20px 40px;
  max-width:900px;
  margin:0 auto;
}

.mando{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  background:var(--panel);
  border:1px solid var(--linea);
  border-radius:8px;
  padding:14px;
  margin-bottom:16px;
}

.mando .titulo{
  width:100%;
  color:var(--tenue);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

input{
  padding:9px 11px;
  border-radius:6px;
  border:1px solid var(--linea);
  background:#111519;
  color:var(--texto);
  font-size:16px;
}

#ref{
  width:105px;
}

#idBanco{
  width:215px;
  font-size:14px;
}

#per{
  width:90px;
}

button{
  padding:9px 16px;
  border-radius:6px;
  border:1px solid var(--linea);
  background:#252d37;
  color:var(--texto);
  font-size:14px;
  cursor:pointer;
}

button:hover{
  background:#2f3944;
}

button.principal{
  background:var(--traza1);
  border-color:var(--traza1);
  color:#0c1116;
  font-weight:600;
}

button.activo{
  background:var(--traza2);
  border-color:var(--traza2);
  color:#0c1116;
  font-weight:600;
}

.lecturas{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
  gap:1px;
  background:var(--linea);
  border:1px solid var(--linea);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:18px;
}

.lectura{
  background:var(--panel);
  padding:11px 13px;
}

.lectura span{
  display:block;
  color:var(--tenue);
  font-size:12px;
  margin-bottom:2px;
}

.lectura strong{
  font-size:20px;
  font-weight:600;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

figure{
  margin:0 0 20px;
}

figcaption{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
  align-items:baseline;
  margin-bottom:7px;
  font-size:13px;
}

figcaption b{
  font-weight:600;
  font-size:14px;
}

.clave{
  color:var(--tenue);
}

.clave i{
  display:inline-block;
  width:11px;
  height:3px;
  border-radius:2px;
  margin-right:5px;
  vertical-align:middle;
}

canvas{
  width:100%;
  height:190px;
  display:block;
  background:var(--panel);
  border:1px solid var(--linea);
  border-radius:8px;
}

#estado{
  color:var(--tenue);
  font-size:13px;
  margin-left:auto;
}

#estado.vivo{
  color:var(--traza1);
}

#estado.roto{
  color:var(--traza3);
}
</style>
</head>

<body>

<header>
  <h1>Banco de control en cascada</h1>
  <p>Grua-pendulo · muestreo 10 ms · telemetria 20 Hz por MQTT</p>
</header>

<main>

  <div class="mando">
    <input id="idBanco" value="romero03">
    <button onclick="reconectar()">Conectar</button>
    <span id="estado">sin conectar</span>
  </div>

  <div class="mando">
    <input
      type="number"
      id="ref"
      value="0"
      step="5"
      min="-90"
      max="90"
    >

    <button
      class="principal"
      onclick="irAObjetivo()"
    >
      Ir a ese angulo
    </button>

    <button onclick="enviar('stop')">
      Detener motor
    </button>

    <button onclick="enviar('zero')">
      Recalibrar ceros
    </button>

    <button onclick="descargar()">
      Descargar CSV
    </button>
  </div>

  <div class="mando">

    <span class="titulo">
      Señal de referencia
    </span>

    <button
      id="btn_sig_step"
      onclick="elegirSenal('step','btn_sig_step')"
    >
      Escalon
    </button>

    <button
      id="btn_sig_pulso"
      onclick="elegirSenal('pulso','btn_sig_pulso')"
    >
      Tren de pulsos
    </button>

    <button
      id="btn_sig_secuencia"
      onclick="elegirSenal('secuencia','btn_sig_secuencia')"
    >
      Repeating Sequence
    </button>

    <button
      id="btn_sig_seno"
      onclick="elegirSenal('seno','btn_sig_seno')"
    >
      Senoidal
    </button>

  </div>

  <div class="mando">

    <span class="titulo">
      Periodo
    </span>

    <input
      type="number"
      id="per"
      value="4"
      step="0.5"
      min="0.5"
    >

    <button
      onclick="enviar('per:' + document.getElementById('per').value)"
    >
      Aplicar periodo [s]
    </button>

  </div>


  <div class="mando">

    <span class="titulo">
      Controlador C1
    </span>

    <button
      id="btn_ctrl_lgr"
      onclick="elegirControlador('lgr','btn_ctrl_lgr')"
    >
      LGR
    </button>

    <button
      id="btn_ctrl_pd"
      onclick="elegirControlador('pd','btn_ctrl_pd')"
    >
      PD
    </button>

  </div>


  <div class="lecturas">

    <div class="lectura">
      <span>Referencia base</span>
      <strong id="v_refb">—</strong>
    </div>

    <div class="lectura">
      <span>Referencia brazo</span>
      <strong id="v_ref">—</strong>
    </div>

    <div class="lectura">
      <span>Brazo</span>
      <strong id="v_pot">—</strong>
    </div>

    <div class="lectura">
      <span>Pendulo</span>
      <strong id="v_as">—</strong>
    </div>

    <div class="lectura">
      <span>PWM</span>
      <strong id="v_pwm">—</strong>
    </div>

  </div>


  <figure>

    <figcaption>

      <b>
        Posicion real vs referencia
      </b>

      <span class="clave">
        <i style="background:var(--traza2)"></i>
        referencia [°]
      </span>

      <span class="clave">
        <i style="background:var(--traza1)"></i>
        brazo [°]
      </span>

    </figcaption>

    <canvas id="cPos"></canvas>

  </figure>


  <figure>

    <figcaption>

      <b>
        Pendulo
      </b>

      <span class="clave">
        <i style="background:var(--traza1)"></i>
        error eAS [°]
      </span>

      <span class="clave">
        <i style="background:var(--traza2)"></i>
        control uAS
      </span>

    </figcaption>

    <canvas id="c1"></canvas>

  </figure>


  <figure>

    <figcaption>

      <b>
        Brazo
      </b>

      <span class="clave">
        <i style="background:var(--traza1)"></i>
        error ePOT [°]
      </span>

      <span class="clave">
        <i style="background:var(--traza2)"></i>
        control
      </span>

      <span class="clave">
        <i style="background:var(--traza3)"></i>
        PWM
      </span>

    </figcaption>

    <canvas id="c2"></canvas>

  </figure>

</main>


<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>

const BROKER =
  'wss://broker.hivemq.com:8884/mqtt';

const VENTANA = 600;

let cliente = null;
let datos = [];

const $ =
  id => document.getElementById(id);


function estado(txt,clase){

  const e = $('estado');

  e.textContent = txt;

  e.className = clase || '';
}


function reconectar(){

  if(cliente)
    cliente.end(true);

  const id =
    $('idBanco').value.trim();

  if(!id){

    estado(
      'falta identificador',
      'roto'
    );

    return;
  }


  estado(
    'conectando'
  );


  cliente =
    mqtt.connect(
      BROKER,
      {
        clientId:
          'web-' +
          Math.random()
          .toString(16)
          .slice(2)
      }
    );


  cliente.on(
    'connect',
    ()=>{

      cliente.subscribe(
        'cascada/' +
        id +
        '/tel'
      );

      estado(
        'en linea',
        'vivo'
      );
    }
  );


  cliente.on(
    'message',
    (t,p)=>{

      try{

        const j =
          JSON.parse(
            p.toString()
          );

        for(const s of j.m)
          datos.push(s);


        if(
          datos.length >
          VENTANA
        )
        {
          datos =
            datos.slice(
              -VENTANA
            );
        }

        pintar();

      }
      catch(e){}
    }
  );


  cliente.on(
    'error',
    ()=>
      estado(
        'error de conexion',
        'roto'
      )
  );


  cliente.on(
    'close',
    ()=>
      estado(
        'conexion cerrada',
        'roto'
      )
  );
}


function enviar(msg){

  if(
    !cliente ||
    !cliente.connected
  )
  {
    estado(
      'conecta primero',
      'roto'
    );

    return;
  }


  cliente.publish(
    'cascada/' +
    $('idBanco').value.trim() +
    '/cmd',
    msg
  );
}


function irAObjetivo(){

  const v =
    $('ref').value;

  enviar(
    'ref:' + v
  );

  enviar(
    'amp:' + v
  );
}


function elegirSenal(
  tipo,
  idBoton
){

  enviar(
    'sig:' + tipo
  );


  document
    .querySelectorAll(
      '#btn_sig_step,' +
      '#btn_sig_pulso,' +
      '#btn_sig_secuencia,' +
      '#btn_sig_seno'
    )
    .forEach(
      b =>
        b.classList.remove(
          'activo'
        )
    );


  $(idBoton)
    .classList.add(
      'activo'
    );
}


function elegirControlador(
  tipo,
  idBoton
){

  enviar(
    'ctrl:' + tipo
  );


  document
    .querySelectorAll(
      '#btn_ctrl_lgr,' +
      '#btn_ctrl_pd'
    )
    .forEach(
      b =>
        b.classList.remove(
          'activo'
        )
    );


  $(idBoton)
    .classList.add(
      'activo'
    );
}


// indices:
// 0 t
// 1 ref
// 2 pot
// 3 pendulo
// 4 eAS
// 5 uAS
// 6 ePot
// 7 uFinal
// 8 pwm

function pintar(){

  if(!datos.length)
    return;


  const u =
    datos[
      datos.length-1
    ];


  const f =
    (x,d=1)=>
      Number(x).toFixed(d);


  $('v_refb').textContent =
    f(u[1]);


  $('v_ref').textContent =
    f(u[1]);


  $('v_pot').textContent =
    f(u[2]);


  $('v_as').textContent =
    f(u[3]);


  $('v_pwm').textContent =
    u[8];


  grafica(
    'cPos',
    [
      [2,'--traza1'],
      [1,'--traza2']
    ]
  );


  grafica(
    'c1',
    [
      [4,'--traza1'],
      [5,'--traza2']
    ]
  );


  grafica(
    'c2',
    [
      [6,'--traza1'],
      [7,'--traza2'],
      [8,'--traza3']
    ]
  );
}


function grafica(
  id,
  trazas
){

  const cv =
    $(id);

  const dpr =
    window.devicePixelRatio || 1;

  const w =
    cv.clientWidth;

  const h =
    cv.clientHeight;


  cv.width =
    w*dpr;

  cv.height =
    h*dpr;


  const g =
    cv.getContext('2d');

  g.scale(
    dpr,
    dpr
  );


  g.clearRect(
    0,
    0,
    w,
    h
  );


  const MI=46;
  const MD=8;
  const MS=8;
  const MB=20;

  const wp =
    w-MI-MD;

  const hp =
    h-MS-MB;


  let lo =
    Infinity;

  let hi =
    -Infinity;


  for(
    const s of datos
  )
  {
    for(
      const [i] of trazas
    )
    {
      lo =
        Math.min(
          lo,
          s[i]
        );

      hi =
        Math.max(
          hi,
          s[i]
        );
    }
  }


  if(
    !isFinite(lo)
  )
  {
    lo=-1;
    hi=1;
  }


  const pad =
    (hi-lo)*0.12 || 1;

  lo-=pad;
  hi+=pad;


  const y =
    v =>
      MS +
      hp -
      (v-lo)/
      (hi-lo)*
      hp;


  const x =
    k =>
      MI +
      k /
      Math.max(
        datos.length-1,
        1
      )
      *
      wp;


  const css =
    getComputedStyle(
      document.documentElement
    );


  const colorTenue =
    css
    .getPropertyValue(
      '--tenue'
    )
    .trim();


  const colorLinea =
    css
    .getPropertyValue(
      '--linea'
    )
    .trim();


  g.strokeStyle =
    colorLinea;

  g.fillStyle =
    colorTenue;

  g.font =
    '11px system-ui';

  g.textAlign =
    'right';

  g.textBaseline =
    'middle';


  for(
    let i=0;
    i<=4;
    i++
  )
  {
    const val =
      lo +
      (hi-lo)*
      i/4;

    const yy =
      y(val);


    g.beginPath();

    g.moveTo(
      MI,
      yy
    );

    g.lineTo(
      w-MD,
      yy
    );

    g.stroke();


    g.fillText(
      val.toFixed(1),
      MI-6,
      yy
    );
  }


  if(
    datos.length>1
  )
  {
    const t0 =
      datos[0][0];


    g.textAlign =
      'center';

    g.textBaseline =
      'top';


    for(
      let i=0;
      i<=4;
      i++
    )
    {
      const k =
        Math.round(
          i/4*
          (
            datos.length-1
          )
        );


      const seg =
        (
          (
            datos[k][0]
            -
            t0
          )
          /
          1000
        ).toFixed(1);


      g.fillText(
        seg+'s',
        x(k),
        h-MB+4
      );
    }
  }


  if(
    lo<0 &&
    hi>0
  )
  {
    g.strokeStyle =
      colorLinea;

    g.beginPath();

    g.moveTo(
      MI,
      y(0)
    );

    g.lineTo(
      w-MD,
      y(0)
    );

    g.stroke();
  }


  for(
    const [i,color]
    of trazas
  )
  {
    g.strokeStyle =
      css
      .getPropertyValue(
        color
      )
      .trim();


    g.lineWidth =
      1.6;


    g.beginPath();


    datos.forEach(
      (s,k)=>{

        if(k)
          g.lineTo(
            x(k),
            y(s[i])
          );

        else
          g.moveTo(
            x(k),
            y(s[i])
          );
      }
    );


    g.stroke();
  }
}


function descargar(){

  const cab =
    't_ms,refPot,pot,as,eAS,uAS,ePot,uPot,pwm\n';


  const cuerpo =
    datos
    .map(
      s=>s.join(',')
    )
    .join('\n');


  const a =
    document.createElement(
      'a'
    );


  a.href =
    URL.createObjectURL(
      new Blob(
        [cab+cuerpo],
        {
          type:'text/csv'
        }
      )
    );


  a.download =
    'cascada.csv';


  a.click();
}


reconectar();

</script>

</body>
</html>
